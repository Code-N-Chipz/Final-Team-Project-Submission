name: Android CI

# runs on every push to every branch -> looking into having it run these tests only on the module that pushed rather than the whole project
# might need to use a specific commit message 
on:
  push:
    branches: [ "**" ]
    tags: [ "**" ]
  pull_request:
    branches: [ "main", "development" ]

# permissions -> contents: read Sets the default GITHUB_TOKEN scope for this workflow to read‑only repo contents. 
# It follows least‑privilege: actions can check out code and read files, but cannot push commits, create releases, or modify repo content via API.

#permissions:
#  contents: read

# concurrency Ensures only one run of this workflow per branch/tag executes at a time.
# group: android-ci-${{ github.ref }} -> groups runs by ref (e.g., refs/heads/feature/pet), so different branches don’t cancel each other.
# cancel-in-progress: true -> when a new run starts for the same group, any in‑progress run is canceled. This avoids wasting CI on outdated pushes.

#concurrency:
#  group: android-ci-${{ github.ref }}
#  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # is a supply‑chain safety check.
      # It verifies the committed Gradle Wrapper (scripts and gradle-wrapper.jar) is the official binary and that distributionUrl is safe (HTTPS/Gradle domain).
      # It prevents malicious wrapper tampering.
      # It should be enabled on all branches, but especially on main/development and pull requests, to protect against attacks via these vectors.
      # Temporarily disabled to avoid failing CI on transient egress issues.
#      - name: Validate Gradle Wrapper
#        if: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/development') }}
#        uses: gradle/actions/wrapper-validation@v3
#        timeout-minutes: 2
#        continue-on-error: true  # temporary: avoid failing CI on transient egress issues

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # configures and caches Gradle
      # Injects Gradle init scripts for build scan/Develocity if configured.
      # Adds job summaries and log annotations for Gradle tasks.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission for `gradlew`
        run: chmod +x gradlew
      - name: Run Android Lint
        run: ./gradlew --no-daemon --stacktrace --debug lint

  detekt:
    name: Detekt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

#      - name: Validate Gradle Wrapper
#        if: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/development') }}
#        uses: gradle/actions/wrapper-validation@v3
#        timeout-minutes: 2
#        continue-on-error: true  # temporary: avoid failing CI on transient egress issues

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission for `gradlew`
        run: chmod +x gradlew
      - name: Run Detekt
        run: ./gradlew --no-daemon --stacktrace --debug detekt

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [ lint, detekt ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

#      - name: Validate Gradle Wrapper
#        if: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/development') }}
#        uses: gradle/actions/wrapper-validation@v3
#        timeout-minutes: 2
#        continue-on-error: true  # temporary: avoid failing CI on transient egress issues

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission for `gradlew`
        run: chmod +x gradlew
      - name: Run unit tests across all modules
        run: ./gradlew --no-daemon --stacktrace --debug testDebugUnitTest test
